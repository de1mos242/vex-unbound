name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build development APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache Unity Library
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-Android-

      - name: Build Android APK
        uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: VexUnbound.Editor.AndroidBuild.BuildDevelopmentApk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VexUnbound-Android-${{ github.sha }}
          path: Builds/Android/VexUnbound.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_TAG: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          package="ghcr.io/${GITHUB_REPOSITORY,,}/android-apk"
          docker login ghcr.io --username "${{ github.actor }}" --password-stdin <<< "$GH_TOKEN"
          cat > Dockerfile.apk <<'DOCKERFILE'
          FROM scratch
          COPY Builds/Android/VexUnbound.apk /VexUnbound.apk
          LABEL org.opencontainers.image.title="Vex Unbound Android APK"
          LABEL org.opencontainers.image.description="Development Android APK built from master."
          DOCKERFILE
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --tag "$package:$PACKAGE_TAG" \
            --tag "$package:latest" \
            --file Dockerfile.apk .
          docker push "$package:$PACKAGE_TAG"
          docker push "$package:latest"

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: android-${{ github.run_number }}.${{ github.run_attempt }}
          RELEASE_TITLE: Android APK ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          gh release create "$RELEASE_TAG" Builds/Android/VexUnbound.apk \
            --title "$RELEASE_TITLE" \
            --notes "Development Android APK built from ${{ github.sha }} on master." \
            --target "${{ github.sha }}" \
            --prerelease
